version: '3.8'

services:
  all-your-handover:
    build: .
    container_name: all-your-handover
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - PORT=3000
      # - ENCRYPTION_KEY=your-encryption-key  # Optional: set to persist encryption key across restarts
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1