<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交接班</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">交接班</div>
    <div id="error" class="error" style="display:none"></div>
    <div id="status" class="status">加载中...</div>
    <div id="content" style="display:none">
      <div id="completeness" class="completeness" style="display:none"></div>
      <div id="savedToast" class="saved-toast" style="display:none">草稿已保存</div>

      <!-- New message notifications -->
      <div id="newMessagesArea" class="new-messages-area" style="display:none">
        <div class="new-messages-header" onclick="window.H5.toggleNewMessages()">
          <span>📨 新消息 <span id="newMsgBadge" class="badge">0</span></span>
          <span id="newMsgArrow" class="arrow">▼</span>
        </div>
        <div id="newMsgBody" class="new-messages-body"></div>
      </div>

      <!-- Update banner (shown in edit mode when preview changed on server) -->
      <div id="updateBanner" class="update-banner" style="display:none">
        <span id="updateBannerText">预览有新变更</span>
        <button onclick="window.H5.refreshFromServer()">刷新查看</button>
      </div>

      <!-- Draft view -->
      <div id="draftView">
        <div class="toolbar">
          <div class="toolbar-left">
            <button id="viewBtn" class="active" onclick="window.H5.switchToView()">查看</button>
            <button id="editBtn" onclick="window.H5.switchToEdit()">编辑</button>
          </div>
        </div>

        <!-- View mode -->
        <div id="previewDisplay" class="preview"></div>

        <!-- Edit mode -->
        <div id="previewEditor" style="display:none">
          <textarea id="editorArea" class="editor"></textarea>
        </div>

        <div class="actions">
          <button class="btn btn-save" onclick="window.H5.saveDraft()">保存草稿</button>
          <button class="btn btn-primary" onclick="window.H5.startHandover()">确认交班</button>
        </div>
      </div>

      <!-- Pending handover: accept/reject -->
      <div id="pendingView" style="display:none">
        <div class="pending-info">
          <h3>待接班</h3>
          <p id="senderInfo"></p>
          <p id="createdAtInfo"></p>
        </div>
        <div id="pendingPreview" class="preview"></div>
        <div class="actions">
          <button class="btn btn-primary" onclick="window.H5.acceptHandover()">确认接班</button>
          <button class="btn btn-danger" onclick="window.H5.rejectHandover()">打回</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bulk assign modal (shown before handover when unassigned messages exist) -->
  <div id="bulkAssignModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-title">班次归属确认</div>
      <div class="modal-subtitle">以下消息尚未归属班次，请逐条确认：</div>
      <div id="bulkAssignList" class="modal-list"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="window.H5.cancelBulkAssign()">取消</button>
        <button class="btn btn-primary" id="bulkAssignConfirmBtn" onclick="window.H5.confirmBulkAssign()">全部纳入当前交接</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
