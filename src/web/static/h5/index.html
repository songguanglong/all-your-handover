<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交接班</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .header { text-align: center; padding: 16px 0; font-size: 18px; font-weight: 600; }
    .completeness { background: #fff3cd; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .completeness.ok { background: #d4edda; }
    .preview { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; min-height: 200px; }
    .preview h1 { font-size: 18px; margin-bottom: 12px; }
    .preview h2 { font-size: 16px; margin-top: 16px; margin-bottom: 8px; color: #1a73e8; }
    .preview h3 { font-size: 15px; margin-top: 12px; margin-bottom: 6px; color: #555; }
    .preview ul { padding-left: 20px; }
    .preview li { margin-bottom: 4px; line-height: 1.6; }
    .editor { width: 100%; min-height: 300px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 14px; line-height: 1.6; font-family: inherit; resize: vertical; }
    .actions { display: flex; gap: 12px; margin-top: 16px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-save { background: #34a853; color: white; }
    .btn-secondary { background: #f1f3f4; color: #333; }
    .btn-danger { background: #ea4335; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { text-align: center; padding: 24px; font-size: 14px; color: #666; }
    .pending-info { background: #e8f0fe; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .pending-info h3 { margin-bottom: 8px; }
    .error { background: #fce8e6; padding: 12px; border-radius: 8px; margin-bottom: 16px; color: #c5221f; }
    .saved-toast { background: #d4edda; color: #155724; padding: 8px 12px; border-radius: 4px; font-size: 13px; display: inline-block; margin-bottom: 12px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .toolbar-left { display: flex; gap: 8px; }
    .toolbar button { padding: 6px 14px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 14px; background: white; }
    .toolbar button.active { background: #1a73e8; color: white; border-color: #1a73e8; }

    /* New message notification area */
    .new-messages-area { margin-bottom: 16px; }
    .new-messages-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: #e8f0fe; border-radius: 8px 8px 0 0;
      font-size: 14px; font-weight: 600; color: #1a73e8; cursor: pointer;
    }
    .new-messages-header .badge {
      background: #ea4335; color: white; border-radius: 10px;
      padding: 2px 8px; font-size: 12px; margin-left: 6px;
    }
    .new-messages-header .arrow { font-size: 12px; transition: transform 0.2s; }
    .new-messages-header .arrow.collapsed { transform: rotate(-90deg); }
    .new-messages-body { border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
    .new-messages-body.collapsed { display: none; }
    .new-msg-item {
      padding: 12px; border-bottom: 1px solid #f0f0f0; background: white;
    }
    .new-msg-item:last-child { border-bottom: none; }
    .new-msg-sender { font-size: 13px; color: #666; margin-bottom: 4px; }
    .new-msg-sender strong { color: #333; }
    .new-msg-content { font-size: 14px; line-height: 1.5; margin-bottom: 4px; }
    .new-msg-analysis { font-size: 12px; color: #888; margin-bottom: 8px; }
    .new-msg-analysis .tag {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      font-size: 11px; margin-right: 4px;
    }
    .tag-category { background: #e8f0fe; color: #1a73e8; }
    .tag-urgency-high { background: #fce8e6; color: #c5221f; }
    .tag-urgency-normal { background: #fef7e0; color: #b45309; }
    .tag-urgency-low { background: #e8f5e9; color: #1b5e20; }
    .new-msg-actions { display: flex; gap: 8px; }
    .new-msg-actions button {
      flex: 1; padding: 8px; border: none; border-radius: 6px;
      font-size: 13px; cursor: pointer; font-weight: 500;
    }
    .btn-include { background: #1a73e8; color: white; }
    .btn-include:hover { background: #1557b0; }
    .btn-exclude { background: #f1f3f4; color: #5f6368; }
    .btn-exclude:hover { background: #e0e0e0; }

    /* Update banner */
    .update-banner {
      background: #fff3cd; border-radius: 8px; padding: 10px 14px;
      margin-bottom: 12px; font-size: 14px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .update-banner button {
      background: #f59e0b; color: white; border: none; border-radius: 4px;
      padding: 4px 12px; cursor: pointer; font-size: 13px;
    }
    .update-banner button:hover { background: #d97706; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">交接班</div>
    <div id="error" class="error" style="display:none"></div>
    <div id="status" class="status">加载中...</div>
    <div id="content" style="display:none">
      <div id="completeness" class="completeness" style="display:none"></div>
      <div id="savedToast" class="saved-toast" style="display:none">草稿已保存</div>

      <!-- New message notifications -->
      <div id="newMessagesArea" class="new-messages-area" style="display:none">
        <div class="new-messages-header" onclick="toggleNewMessages()">
          <span>📨 新消息 <span id="newMsgBadge" class="badge">0</span></span>
          <span id="newMsgArrow" class="arrow">▼</span>
        </div>
        <div id="newMsgBody" class="new-messages-body"></div>
      </div>

      <!-- Update banner (shown in edit mode when preview changed on server) -->
      <div id="updateBanner" class="update-banner" style="display:none">
        <span id="updateBannerText">预览有新变更</span>
        <button onclick="refreshFromServer()">刷新查看</button>
      </div>

      <!-- Draft view -->
      <div id="draftView">
        <div class="toolbar">
          <div class="toolbar-left">
            <button id="viewBtn" class="active" onclick="switchToView()">查看</button>
            <button id="editBtn" onclick="switchToEdit()">编辑</button>
          </div>
        </div>

        <!-- View mode -->
        <div id="previewDisplay" class="preview"></div>

        <!-- Edit mode -->
        <div id="previewEditor" style="display:none">
          <textarea id="editorArea" class="editor"></textarea>
        </div>

        <div class="actions">
          <button class="btn btn-save" onclick="saveDraft()">保存草稿</button>
          <button class="btn btn-primary" onclick="startHandover()">确认交班</button>
        </div>
      </div>

      <!-- Pending handover: accept/reject -->
      <div id="pendingView" style="display:none">
        <div class="pending-info">
          <h3>待接班</h3>
          <p id="senderInfo"></p>
          <p id="createdAtInfo"></p>
        </div>
        <div id="pendingPreview" class="preview"></div>
        <div class="actions">
          <button class="btn btn-primary" onclick="acceptHandover()">确认接班</button>
          <button class="btn btn-danger" onclick="rejectHandover()">打回</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/h5';
    const POLL_INTERVAL = 5000; // 5 seconds

    let channelCode = '';
    let editing = false;
    let currentUser = null;
    let toastTimer = null;
    let knownMsgIds = new Set();  // msgIds we've already seen
    let pendingNewItems = [];     // new items awaiting user decision
    let assignedItems = new Set(); // msgIds already assigned to a shift
    let pollTimer = null;
    let lastAnalysisUpdate = '';   // timestamp of last analysis update

    function getChannelCode() {
      const params = new URLSearchParams(window.location.search);
      return params.get('code') || '';
    }

    async function authenticate() {
      const params = new URLSearchParams(window.location.search);
      const authCode = params.get('auth_code');
      if (authCode) {
        try {
          const res = await fetch(`${API_BASE}/auth/feishu?code=${encodeURIComponent(authCode)}`);
          const data = await res.json();
          if (data.code === 0 && data.data) {
            currentUser = data.data;
            sessionStorage.setItem('h5_user', JSON.stringify(currentUser));
            return;
          }
        } catch (err) {
          console.error('认证失败:', err);
        }
      }
      const cached = sessionStorage.getItem('h5_user');
      if (cached) {
        try { currentUser = JSON.parse(cached); } catch {}
      }
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    function showSavedToast() {
      const el = document.getElementById('savedToast');
      el.style.display = 'inline-block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function renderMarkdown(text) {
      return text
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/\n{2,}/g, '</p><p>')
        .replace(/\n/g, '<br>');
    }

    function urgencyLabel(u) {
      const map = { high: '紧急', normal: '一般', low: '低' };
      return map[u] || '一般';
    }

    function urgencyTagClass(u) {
      const map = { high: 'tag-urgency-high', normal: 'tag-urgency-normal', low: 'tag-urgency-low' };
      return map[u] || 'tag-urgency-normal';
    }

    // Detect new items by comparing with known msgIds
    function detectNewItems(items) {
      const newItems = [];
      for (const item of items) {
        if (!knownMsgIds.has(item.msgId) && !assignedItems.has(item.msgId) && item.shift !== 'next') {
          newItems.push(item);
        }
      }
      return newItems;
    }

    // Render the new message notification area
    function renderNewMessages() {
      const area = document.getElementById('newMessagesArea');
      const body = document.getElementById('newMsgBody');
      const badge = document.getElementById('newMsgBadge');

      if (pendingNewItems.length === 0) {
        area.style.display = 'none';
        return;
      }

      area.style.display = 'block';
      badge.textContent = pendingNewItems.length;

      body.innerHTML = pendingNewItems.map(item => `
        <div class="new-msg-item" id="newMsg-${item.msgId}">
          <div class="new-msg-sender">新消息</div>
          <div class="new-msg-content">${escapeHtml(item.content)}</div>
          <div class="new-msg-analysis">
            <span class="tag tag-category">${escapeHtml(item.category)}</span>
            <span class="tag ${urgencyTagClass(item.urgency)}">${urgencyLabel(item.urgency)}</span>
          </div>
          <div class="new-msg-actions">
            <button class="btn-include" onclick="assignShift('${item.msgId}', 'current')">纳入交接 ✓</button>
            <button class="btn-exclude" onclick="assignShift('${item.msgId}', 'next')">归入下一班 →</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function toggleNewMessages() {
      const body = document.getElementById('newMsgBody');
      const arrow = document.getElementById('newMsgArrow');
      if (body.classList.contains('collapsed')) {
        body.classList.remove('collapsed');
        arrow.classList.remove('collapsed');
      } else {
        body.classList.add('collapsed');
        arrow.classList.add('collapsed');
      }
    }

    async function assignShift(msgId, shift) {
      // Disable buttons for this item immediately to prevent double-click
      const itemEl = document.getElementById(`newMsg-${msgId}`);
      if (itemEl) {
        const buttons = itemEl.querySelectorAll('button');
        buttons.forEach(b => { b.disabled = true; });
      }

      try {
        const res = await fetch(`${API_BASE}/draft/${channelCode}/assign-shift`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msgId, shift }),
        });
        const data = await res.json();
        if (data.code === 0) {
          // Remove from pending list by msgId (not index — avoids concurrent race)
          pendingNewItems = pendingNewItems.filter(i => i.msgId !== msgId);
          assignedItems.add(msgId);
          knownMsgIds.add(msgId);
          renderNewMessages();
          // Refresh preview
          await refreshFromServer();
        } else {
          showError(data.message || '操作失败');
          // Re-enable buttons on failure
          if (itemEl) {
            const buttons = itemEl.querySelectorAll('button');
            buttons.forEach(b => { b.disabled = false; });
          }
        }
      } catch (err) {
        showError('网络错误');
        if (itemEl) {
          const buttons = itemEl.querySelectorAll('button');
          buttons.forEach(b => { b.disabled = false; });
        }
      }
    }

    async function refreshFromServer() {
      hideError();
      try {
        const res = await fetch(`${API_BASE}/draft/${channelCode}`);
        const data = await res.json();
        if (data.code !== 0) {
          showError(data.message || '刷新失败');
          return;
        }

        const d = data.data;

        // Update completeness
        const compEl = document.getElementById('completeness');
        if (d.missingCount > 0) {
          compEl.textContent = `还有 ${d.missingCount} 条消息未分析（共 ${d.rawCount} 条）`;
          compEl.className = 'completeness';
        } else {
          compEl.textContent = `全部 ${d.rawCount} 条消息已分析`;
          compEl.className = 'completeness ok';
        }
        compEl.style.display = 'block';

        // Update preview (only in view mode)
        if (!editing) {
          document.getElementById('previewDisplay').innerHTML = renderMarkdown(d.preview || '暂无内容');
          document.getElementById('editorArea').value = d.preview || '';
        }

        // Update known items
        const currentItems = d.items || [];
        for (const item of currentItems) {
          knownMsgIds.add(item.msgId);
        }
        lastAnalysisUpdate = d.lastUpdated || '';

        // Hide update banner since we just refreshed
        document.getElementById('updateBanner').style.display = 'none';

        // Check for pending handover state
        await checkPendingState();
      } catch (err) {
        showError('刷新失败');
      }
    }

    async function loadDraft() {
      hideError();
      try {
        const res = await fetch(`${API_BASE}/draft/${channelCode}`);
        const data = await res.json();
        if (data.code !== 0) {
          showError(data.message || '加载失败');
          return;
        }

        const d = data.data;
        document.getElementById('status').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Completeness
        const compEl = document.getElementById('completeness');
        if (d.missingCount > 0) {
          compEl.textContent = `还有 ${d.missingCount} 条消息未分析（共 ${d.rawCount} 条）`;
          compEl.className = 'completeness';
        } else {
          compEl.textContent = `全部 ${d.rawCount} 条消息已分析`;
          compEl.className = 'completeness ok';
        }
        compEl.style.display = 'block';

        // Preview
        document.getElementById('previewDisplay').innerHTML = renderMarkdown(d.preview || '暂无内容');
        document.getElementById('editorArea').value = d.preview || '';

        // Track known items
        const items = d.items || [];
        for (const item of items) {
          knownMsgIds.add(item.msgId);
          if (item.shift === 'next') {
            assignedItems.add(item.msgId);
          }
        }
        lastAnalysisUpdate = d.lastUpdated || '';

        // Check if there's a pending handover
        await checkPendingState();

        // Start polling for new messages
        startPolling();
      } catch (err) {
        showError('网络错误，请重试');
      }
    }

    async function checkPendingState() {
      try {
        // Try to get pending handover info
        const res = await fetch(`${API_BASE}/handover/${channelCode}/pending`);
        if (res.ok) {
          const data = await res.json();
          if (data.code === 0 && data.data) {
            // There's a pending handover — show pending view
            showPendingView(data.data);
            return;
          }
        }
        // No pending — show draft view
        document.getElementById('draftView').style.display = 'block';
        document.getElementById('pendingView').style.display = 'none';
      } catch {
        document.getElementById('draftView').style.display = 'block';
        document.getElementById('pendingView').style.display = 'none';
      }
    }

    function showPendingView(pending) {
      document.getElementById('draftView').style.display = 'none';
      document.getElementById('pendingView').style.display = 'block';
      document.getElementById('senderInfo').textContent = `交班人: ${pending.sender?.name || '未知'}`;
      document.getElementById('createdAtInfo').textContent = `时间: ${pending.createdAt || ''}`;
      document.getElementById('pendingPreview').innerHTML = renderMarkdown(pending.content || '');
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollForUpdates, POLL_INTERVAL);
    }

    async function pollForUpdates() {
      try {
        // Lightweight poll — only fetch status, not full preview
        const statusRes = await fetch(`${API_BASE}/draft/${channelCode}/status`);
        const statusData = await statusRes.json();
        if (statusData.code !== 0) return;

        const s = statusData.data;

        // If no new items since last check, just update completeness
        if (s.lastUpdated === lastAnalysisUpdate) {
          const compEl = document.getElementById('completeness');
          if (s.missingCount > 0) {
            compEl.textContent = `还有 ${s.missingCount} 条消息未分析（共 ${s.rawCount} 条）`;
            compEl.className = 'completeness';
          } else {
            compEl.textContent = `全部 ${s.rawCount} 条消息已分析`;
            compEl.className = 'completeness ok';
          }
          return;
        }

        // Something changed — fetch full data
        const res = await fetch(`${API_BASE}/draft/${channelCode}`);
        const data = await res.json();
        if (data.code !== 0) return;

        const d = data.data;
        const items = d.items || [];

        // Detect new items
        const newItems = detectNewItems(items);
        if (newItems.length > 0) {
          pendingNewItems = pendingNewItems.concat(newItems);
          renderNewMessages();

          // If in view mode, auto-refresh preview
          if (!editing) {
            document.getElementById('previewDisplay').innerHTML = renderMarkdown(d.preview || '暂无内容');
            document.getElementById('editorArea').value = d.preview || '';
          } else {
            const banner = document.getElementById('updateBanner');
            banner.style.display = 'flex';
            document.getElementById('updateBannerText').textContent =
              `有 ${newItems.length} 条新消息已分析完成`;
          }

          for (const item of items) {
            knownMsgIds.add(item.msgId);
          }
        } else if (!editing) {
          // No new items but data changed — refresh preview in view mode
          document.getElementById('previewDisplay').innerHTML = renderMarkdown(d.preview || '暂无内容');
          document.getElementById('editorArea').value = d.preview || '';
        }

        // Update completeness
        const compEl = document.getElementById('completeness');
        if (d.missingCount > 0) {
          compEl.textContent = `还有 ${d.missingCount} 条消息未分析（共 ${d.rawCount} 条）`;
          compEl.className = 'completeness';
        } else {
          compEl.textContent = `全部 ${d.rawCount} 条消息已分析`;
          compEl.className = 'completeness ok';
        }

        lastAnalysisUpdate = d.lastUpdated || '';
      } catch {
        // Silent fail on poll errors
      }
    }

    function switchToView() {
      editing = false;
      document.getElementById('previewDisplay').style.display = 'block';
      document.getElementById('previewEditor').style.display = 'none';
      document.getElementById('viewBtn').classList.add('active');
      document.getElementById('editBtn').classList.remove('active');
      // Hide update banner when switching to view
      document.getElementById('updateBanner').style.display = 'none';
      // Refresh preview from server
      refreshFromServer();
    }

    function switchToEdit() {
      editing = true;
      document.getElementById('previewDisplay').style.display = 'none';
      document.getElementById('previewEditor').style.display = 'block';
      document.getElementById('editBtn').classList.add('active');
      document.getElementById('viewBtn').classList.remove('active');
      document.getElementById('editorArea').focus();
    }

    async function saveDraft() {
      const content = editing
        ? document.getElementById('editorArea').value
        : undefined;

      if (!editing) return;
      if (!content && editing) return;

      try {
        const res = await fetch(`${API_BASE}/draft/${channelCode}/preview`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        const data = await res.json();
        if (data.code === 0) {
          showSavedToast();
          // Hide update banner after save
          document.getElementById('updateBanner').style.display = 'none';
        } else {
          showError(data.message || '保存失败');
        }
      } catch (err) {
        showError('网络错误');
      }
    }

    async function startHandover() {
      // If in edit mode, auto-save first
      if (editing) {
        const content = document.getElementById('editorArea').value;
        try {
          const saveRes = await fetch(`${API_BASE}/draft/${channelCode}/preview`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content }),
          });
          const saveData = await saveRes.json();
          if (saveData.code !== 0) {
            showError('保存草稿失败: ' + (saveData.message || '未知错误'));
            return;
          }
        } catch (err) {
          showError('保存草稿失败，请重试');
          return;
        }
      }

      // Check for unassigned new messages
      if (pendingNewItems.length > 0) {
        const confirmMsg = `还有 ${pendingNewItems.length} 条新消息未归属班次，确认交班将全部纳入当前交接。是否继续？`;
        if (!confirm(confirmMsg)) return;
        // Auto-assign all pending new items to current shift
        for (const item of pendingNewItems) {
          try {
            await fetch(`${API_BASE}/draft/${channelCode}/assign-shift`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ msgId: item.msgId, shift: 'current' }),
            });
          } catch {}
        }
        pendingNewItems = [];
        renderNewMessages();
      }

      if (!confirm('确认发起交班？')) return;

      const body = {};
      if (currentUser) {
        body.senderId = currentUser.open_id;
        body.senderName = currentUser.name;
      }
      try {
        const res = await fetch(`${API_BASE}/handover/${channelCode}/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.code === 0) {
          alert('交班已发起');
          if (pollTimer) clearInterval(pollTimer);
          location.reload();
        } else {
          showError(data.message || data.data?.message || '交班失败');
        }
      } catch (err) {
        showError('网络错误');
      }
    }

    async function acceptHandover() {
      if (!confirm('确认接班？')) return;
      const body = {};
      if (currentUser) {
        body.receiverId = currentUser.open_id;
        body.receiverName = currentUser.name;
      }
      try {
        const res = await fetch(`${API_BASE}/handover/${channelCode}/accept`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.code === 0) {
          alert('接班确认成功');
          if (pollTimer) clearInterval(pollTimer);
          location.reload();
        } else {
          showError(data.message || data.data?.message || '接班确认失败');
        }
      } catch (err) {
        showError('网络错误');
      }
    }

    async function rejectHandover() {
      if (!confirm('确认打回？交班人需要重新编辑草稿。')) return;
      try {
        const res = await fetch(`${API_BASE}/handover/${channelCode}/reject`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const data = await res.json();
        if (data.code === 0) {
          alert('已打回');
          if (pollTimer) clearInterval(pollTimer);
          location.reload();
        } else {
          showError(data.message || '打回失败');
        }
      } catch (err) {
        showError('网络错误');
      }
    }

    // Init
    channelCode = getChannelCode();
    if (!channelCode) {
      document.getElementById('status').textContent = '缺少渠道参数';
    } else {
      authenticate().then(() => loadDraft());
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (pollTimer) clearInterval(pollTimer);
    });

    // Pause/resume polling based on page visibility
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = null;
      } else {
        // Page visible again — poll immediately then resume interval
        pollForUpdates();
        startPolling();
      }
    });
  </script>
</body>
</html>
